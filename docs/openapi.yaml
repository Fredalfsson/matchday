openapi: 3.1.0
info:
  title: Matchday API
  version: 0.1.0
  description: API for importing and reading Allsvenskan matches and creating match circles.
servers:
  - url: http://127.0.0.1:8080
    description: Local development
tags:
  - name: Matches
    description: Read-only access to matches stored by Matchday.
  - name: Circles
    description: Match-linked discussion circles and their memberships.
  - name: Match imports
    description: Administrative operations for importing or refreshing match data.
paths:
  /api/v1/matches:
    get:
      tags:
        - Matches
      summary: List stored matches
      description: >-
        Returns matches ordered by season, round, scheduled date, kickoff time, and match ID.
      operationId: listMatches
      security: []
      responses:
        "200":
          description: Stored matches in the backend's stable default order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"
        "406":
          description: The requested response media type is not supported
  /api/v1/matches/{matchId}/circle:
    parameters:
      - name: matchId
        in: path
        required: true
        description: ID of the match whose discussion circle should be created.
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Circles
      summary: Create a match circle
      description: >-
        Creates the single discussion circle for the match and adds the authenticated creator as
        its first active member. The declared Basic Auth scheme applies to the documented local
        server; the production authentication mechanism will be supplied by the authentication
        integration and is intentionally not fixed by this contract yet.
      operationId: createMatchCircle
      security:
        - localBasicAuth: []
      responses:
        "201":
          description: Circle created and creator membership activated
          headers:
            Location:
              description: Relative URI of the created match circle.
              required: true
              schema:
                type: string
                format: uri-reference
              example: /api/v1/matches/10000000-0000-0000-0000-000000000001/circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Circle"
        "400":
          description: The matchId path parameter is not a valid UUID
        "401":
          description: >-
            Authentication is required. The security layer may return this status without a body;
            an authenticated request whose application identity cannot be resolved returns a
            problem detail.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: urn:matchday:problem:authentication-required
                title: Authentication required
                status: 401
                detail: An authenticated user identity is required
                instance: /api/v1/matches/10000000-0000-0000-0000-000000000001/circle
        "403":
          description: >-
            The request is rejected by the active security policy, for example when CSRF protection
            is enabled and the request does not contain a valid CSRF token.
        "404":
          description: The match does not exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: urn:matchday:problem:match-not-found
                title: Match not found
                status: 404
                detail: Match 10000000-0000-0000-0000-000000000099 was not found
                instance: /api/v1/matches/10000000-0000-0000-0000-000000000099/circle
        "409":
          description: A circle already exists for the match
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: urn:matchday:problem:circle-already-exists
                title: Circle already exists
                status: 409
                detail: A circle already exists for match 10000000-0000-0000-0000-000000000001
                instance: /api/v1/matches/10000000-0000-0000-0000-000000000001/circle
  /api/v1/admin/match-imports:
    post:
      tags:
        - Match imports
      summary: Import or refresh a season
      description: Imports every Allsvenskan round for the requested season and updates stored matches.
      operationId: importSeason
      security:
        - localBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchImportRequest"
      responses:
        "200":
          description: Season imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchImportResponse"
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
components:
  securitySchemes:
    localBasicAuth:
      type: http
      scheme: basic
      description: >-
        Basic Auth supplied by the local profile. Circle operations additionally require an
        authentication adapter that resolves the credentials to a stable application user ID.
  schemas:
    Match:
      type: object
      required:
        - id
        - season
        - round
        - homeTeamName
        - awayTeamName
        - scheduledDate
        - kickoffAt
        - status
        - homeScore
        - awayScore
        - venueName
      properties:
        id:
          type: string
          format: uuid
        season:
          type: integer
          format: int32
          minimum: 1
        round:
          type: integer
          format: int32
          minimum: 1
        homeTeamName:
          type: string
          minLength: 1
        awayTeamName:
          type: string
          minLength: 1
        scheduledDate:
          type: string
          format: date
        kickoffAt:
          type:
            - string
            - "null"
          format: date-time
        status:
          type: string
          enum:
            - SCHEDULED
            - FINISHED
            - POSTPONED
            - UNKNOWN
        homeScore:
          type:
            - integer
            - "null"
          format: int32
          minimum: 0
        awayScore:
          type:
            - integer
            - "null"
          format: int32
          minimum: 0
        venueName:
          type:
            - string
            - "null"
          minLength: 1
    Circle:
      type: object
      description: >-
        A match's discussion circle as returned after creation. User identifiers and email
        addresses are intentionally not exposed.
      required:
        - id
        - matchId
        - createdAt
        - membershipActive
      properties:
        id:
          type: string
          format: uuid
        matchId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        membershipActive:
          type: boolean
          const: true
          description: The creator's membership is active when creation succeeds.
    ProblemDetail:
      type: object
      description: RFC 9457 problem details returned for application-level API errors.
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri
          description: Stable identifier for the problem type.
        title:
          type: string
          minLength: 1
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
        detail:
          type: string
          minLength: 1
        instance:
          type: string
          format: uri-reference
          description: URI of the request that produced this problem occurrence.
    MatchImportRequest:
      type: object
      required:
        - season
      properties:
        season:
          type: integer
          format: int32
          minimum: 1
    MatchImportResponse:
      type: object
      required:
        - season
        - processedMatches
      properties:
        season:
          type: integer
          format: int32
          minimum: 1
        processedMatches:
          type: integer
          format: int32
          minimum: 0

services:
  frontend:
    image: 'node:26-slim'
    command: ['sh', '-c', 'npm install && npm run dev -- --hostname 0.0.0.0']
    working_dir: '/frontend/'
    ports:
      - '3000:3000'

  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=matchday'
      - 'POSTGRES_PASSWORD=app'
      - 'POSTGRES_USER=app'
    ports:
      - '5432:5432'

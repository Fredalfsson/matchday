services:
  frontend:
    image: 'node:26-slim'
    command: ['sh', '-c', 'npm install && npm run dev -- --hostname 0.0.0.0']
    working_dir: '/frontend/'
    ports:
      - '3000:3000'

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matchday}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - matchday_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: app/Dockerfile
      target: dev
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      PORT: '3000'
      API_URL: http://backend:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    depends_on:
      backend:
        condition: service_started

  backend:
    image: maven:3.9.11-eclipse-temurin-25
    working_dir: /app
    command: mvn --batch-mode spring-boot:run
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-matchday}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-app}
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
    volumes:
      - ./backend:/app
      - backend_maven_cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  matchday_postgres_data:
  backend_maven_cache:
  frontend_node_modules:
  frontend_next:
